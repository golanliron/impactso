<head>
<meta charset="utf-8">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700;900&family=Rubik:wght@500;700;900&display=swap" rel="stylesheet">

<style>
:root{
  --navy:#061E4F;
  --fuchsia:#F00678;
  --teal:#12C7C7;
  --bg:#F8FAFC;
  --white:#FFFFFF;
  --gray:#64748B;
  --bar-h:60px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--bg);
  font-family:"Heebo",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
  color:var(--navy);
  overflow:hidden;
}

/* ——— סרגל אימפקט ——— */
.osbar{
  position:fixed;inset-block-start:0;inset-inline:0;height:var(--bar-h);
  display:flex;align-items:center;gap:14px;
  padding:0 clamp(12px,3vw,26px);
  background:var(--white);
  border-bottom:1px solid #E2E8F0;
  box-shadow:0 1px 14px rgba(6,30,79,.06);
  z-index:10;
}
.osbar__home{display:flex;align-items:center;flex-shrink:0;text-decoration:none}
.osbar__home img{height:34px;width:auto;display:block}
@media (max-width:640px){ .osbar__home img{height:28px} }

.osbar__sep{width:1px;height:26px;background:#E2E8F0;flex-shrink:0}

.osbar__here{
  display:flex;align-items:center;gap:8px;min-width:0;
  font-weight:700;font-size:15px;letter-spacing:.01em;
}
.osbar__dot{
  width:9px;height:9px;border-radius:50%;background:var(--fuchsia);flex-shrink:0;
  box-shadow:0 0 0 4px rgba(240,6,120,.14);
}
.osbar__name{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.osbar__kicker{
  font-size:12.5px;font-weight:500;color:var(--gray);white-space:nowrap;
}
@media (max-width:820px){ .osbar__kicker{display:none} }

.osbar__spacer{flex:1}

.osbar__out{
  display:inline-flex;align-items:center;gap:7px;flex-shrink:0;
  padding:8px 15px;border-radius:999px;
  background:var(--navy);color:#fff;text-decoration:none;
  font-weight:700;font-size:13.5px;
  transition:background .2s cubic-bezier(.22,1,.36,1),transform .2s cubic-bezier(.22,1,.36,1);
}
.osbar__out:hover{background:var(--fuchsia);transform:translateY(-1px)}
.osbar__out svg{width:14px;height:14px;flex-shrink:0}
@media (max-width:520px){
  .osbar__out span{display:none}
  .osbar__out{padding:9px 11px}
}

/* ——— מסגרת האתר ——— */
.stage{
  position:fixed;inset-block-start:var(--bar-h);inset-block-end:0;inset-inline:0;
  background:var(--bg);
}
.stage iframe{width:100%;height:100%;border:0;display:block;background:var(--white)}

/* ——— חיווי טעינה ——— */
.loading{
  position:absolute;inset:0;display:grid;place-content:center;justify-items:center;gap:16px;
  background:var(--bg);text-align:center;padding:24px;
  transition:opacity .35s ease;
}
.loading[hidden]{display:none}
.loading.is-gone{opacity:0;pointer-events:none}
.loading__ring{
  width:34px;height:34px;border-radius:50%;
  border:3px solid #E2E8F0;border-top-color:var(--teal);
  animation:spin .8s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}
.loading__txt{font-size:14px;color:var(--gray);font-weight:500}
@media (prefers-reduced-motion:reduce){ .loading__ring{animation-duration:2.4s} }

/* ——— נפילה חיננית ——— */
.fallback{
  position:absolute;inset:0;display:none;place-content:center;justify-items:center;
  gap:14px;text-align:center;padding:32px;background:var(--bg);
}
.fallback.is-on{display:grid}
.fallback h2{font-family:"Rubik","Heebo",sans-serif;font-size:22px;font-weight:900}
.fallback p{font-size:15px;color:var(--gray);max-width:38ch;line-height:1.6}
.fallback a{
  display:inline-flex;align-items:center;gap:8px;
  padding:11px 22px;border-radius:999px;
  background:var(--fuchsia);color:#fff;text-decoration:none;font-weight:700;font-size:15px;
}
</style>
</head>
<body>

<header class="osbar">
  <a class="osbar__home" href="/" aria-label="חזרה לאתר IMPACT OS">
    <img src="/public/brand/impact-os-logo-nav-teal.png?v=os-logo-4" alt="IMPACT OS">
  </a>
  <div class="osbar__sep" aria-hidden="true"></div>
  <div class="osbar__here">
    <span class="osbar__dot" aria-hidden="true"></span>
    <span class="osbar__name">Learni AI</span>
    <span class="osbar__kicker">‏AI שנשאר אצלכם · lerani.co.il</span>
  </div>
  <div class="osbar__spacer"></div>
  <a class="osbar__out" href="https://lerani.co.il/" target="_blank" rel="noopener">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path>
      <polyline points="15 3 21 3 21 9"></polyline>
      <line x1="10" y1="14" x2="21" y2="3"></line>
    </svg>
    <span>פתיחה בחלון מלא</span>
  </a>
</header>

<main class="stage">
  <iframe id="learniFrame"
          src="https://lerani.co.il/"
          title="אתר Learni AI"
          loading="eager"
          referrerpolicy="no-referrer-when-downgrade"
          allow="clipboard-write; fullscreen"></iframe>

  <div class="loading" id="learniLoading">
    <div class="loading__ring" aria-hidden="true"></div>
    <p class="loading__txt">טוענים את האתר של לרני…</p>
  </div>

  <div class="fallback" id="learniFallback">
    <h2>האתר לא נטען כאן</h2>
    <p>הדפדפן חסם את הצגת האתר בתוך העמוד. אפשר לפתוח אותו ישירות — הכול נשאר אותו דבר.</p>
    <a href="https://lerani.co.il/" target="_blank" rel="noopener">לאתר של Learni AI</a>
  </div>
</main>

<script>
(function(){
  var frame = document.getElementById('learniFrame');
  var loading = document.getElementById('learniLoading');
  var fallback = document.getElementById('learniFallback');
  var settled = false;

  function hideLoader(){
    if(!loading) return;
    loading.classList.add('is-gone');
    setTimeout(function(){ loading.hidden = true; }, 400);
  }

  frame.addEventListener('load', function(){
    settled = true;
    hideLoader();
  });

  /* אם המסגרת לא הודיעה על טעינה תוך 9 שניות — מציעים פתיחה ישירה */
  setTimeout(function(){
    if(settled) return;
    hideLoader();
    fallback.classList.add('is-on');
  }, 9000);
})();
</script>
