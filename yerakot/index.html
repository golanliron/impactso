  ];

  const $ = (s) => document.querySelector(s);
  const screen = $("#screen");
  let answers = [];   // "c" | "t"
  let flips = [];     // random order of options per question

  function typeFor(t) {
    // t = number of tomato answers out of 12
    if (t <= 3) return "cucumber";
    if (t <= 6) return "kishu";
    if (t <= 9) return "pepper";
    return "tomato";
  }

  // ---------- axis ----------
  $("#axisVeg").innerHTML = ORDER.map(k =>
    `<figure data-k="${k}">${SVG[k]}<figcaption>${TYPES[k].name}</figcaption></figure>`).join("");
  $("#authorVeg").innerHTML = SVG.tomato;

  function setAxis(highlight) {
    const n = answers.length;
    const t = answers.filter(a => a === "t").length;
    const ratio = n ? t / n : 0.5;
    // RTL: cucumber on the right (0%), tomato on the left (100%)
    $("#marker").style.right = (ratio * 100) + "%";
    document.querySelectorAll(".axis-veg figure").forEach(f => {
      f.classList.toggle("hit", f.dataset.k === highlight);
      f.classList.toggle("dim", !!highlight && f.dataset.k !== highlight);
    });
  }

  // ---------- screens ----------
  function intro() {
    answers = [];
    flips = QUESTIONS.map(() => Math.random() < 0.5);
    setAxis(null);
    screen.innerHTML = `
      <section class="card intro enter">
        <h1 class="display"><span class="c">מלפפון</span> או <span class="t">עגבנייה?</span></h1>
        <p>12 שאלות של "או-או", ותגלו איזה ירק אתם, מה זה אומר עליכם בעבודה, ואיך לחזק את מה שחסר.</p>
        <button class="btn" id="go">גלו מה אתם · 12 שאלות</button>
        <p class="fine">בלי הרשמה ובלי לשמור שום דבר. רק לבחור מה מתאים לכם יותר.</p>
      </section>`;
    $("#go").onclick = () => ask(0);
  }

  function ask(i) {
    const Q = QUESTIONS[i];
    const pair = flips[i] ? [["t", Q.t], ["c", Q.c]] : [["c", Q.c], ["t", Q.t]];
    const bars = QUESTIONS.map((_, j) =>
      `<span class="${j < i ? "done-" + answers[j] : j === i ? "now" : ""}"></span>`).join("");
    screen.innerHTML = `
      <section class="card q enter" aria-live="polite">
        <div class="progress" aria-hidden="true">${bars}</div>
        <p class="kicker">שאלה ${i + 1} מתוך ${QUESTIONS.length}</p>
        <h2 class="display">${Q.q}</h2>
        <div class="opts">
          ${pair.map(([k, txt], n) => `<button class="opt" id="opt-${i}-${n}" data-k="${k}">${txt}</button>`).join("")}
        </div>
        <div class="q-foot">
          ${i > 0 ? `<button class="link-btn" id="back">חזרה לשאלה הקודמת</button>` : `<span></span>`}
          <span class="fine">אין תשובה נכונה. יש רק ירקות.</span>
        </div>
      </section>`;
    screen.querySelectorAll(".opt").forEach(b => b.onclick = () => {
      b.classList.add("picked");
      screen.querySelectorAll(".opt").forEach(x => x.disabled = true);
      answers[i] = b.dataset.k;
      answers.length = i + 1;
      setAxis(null);
      setTimeout(() => (i + 1 < QUESTIONS.length ? ask(i + 1) : result()), 260);
    });
    const back = $("#back");
    if (back) back.onclick = () => { answers.length = i - 1; setAxis(null); ask(i - 1); };
    screen.querySelector(".opt").focus({ preventScroll: true });
  }

  function result() {
    const t = answers.filter(a => a === "t").length;
    const k = typeFor(t);
    const T = TYPES[k];
    const pctT = Math.round(t / QUESTIONS.length * 100);
    setAxis(k);
    const shareText = `יצאתי ${T.name} (${T.tag}) בשאלון המלפפון והעגבנייה. ואתם?`;
    screen.innerHTML = `
      <section class="card result enter" style="--res: var(${T.color})">
        <p class="kicker">יצא לך</p>
        <div class="res-head">
          ${SVG[k]}
          <div>
            <h2 class="display">${T.name}</h2>
            <p class="res-tag">${T.tag}</p>
          </div>
        </div>
        <p class="split"><b>${pctT}%</b> עגבנייה · <b>${100 - pctT}%</b> מלפפון</p>
        <p>${T.text}</p>
        <dl class="facts">
          <div><dt>כוח העל</dt><dd>${T.power}</dd></div>
          <div><dt>מה צריך לידו${k === "tomato" ? "ה" : ""}</dt><dd>${T.needs}</dd></div>
        </dl>
        <div class="work">
          <h3 class="display">ובעבודה?</h3>
          <p>${T.work}</p>
          <p class="tips-title">3 דרכים לחזק את מה שחסר</p>
          <ol class="tips">${T.tips.map(x => `<li>${x}</li>`).join("")}</ol>
        </div>
        <div class="salad">עגבנייה בלי מלפפון: רעיון שקורס ביום השני.<br>מלפפון בלי עגבנייה: תוכנית שלא יוצאת לדרך.<br>ביחד? סלט.</div>
        <div class="share">
          <button class="btn wide" id="story">תמונה לסטורי</button>
          <a class="btn wa" id="wa" target="_blank" rel="noopener" href="https://wa.me/?text=${encodeURIComponent(shareText + " " + SITE)}">וואטסאפ</a>
          <a class="btn fb" id="fb" target="_blank" rel="noopener" href="https://www.facebook.com/sharer/sharer.php?u=${encodeURIComponent(SITE)}">פייסבוק</a>
          <button class="btn ghost" id="copy">העתקת קישור</button>
          <button class="btn ghost" id="again">עוד פעם</button>
        </div>
        <p class="toast" id="toast" role="status"></p>
      </section>`;
    $("#again").onclick = intro;
    $("#copy").onclick = async () => {
      try { await navigator.clipboard.writeText(shareText + " " + SITE); toast("הקישור הועתק. עכשיו להדביק בקבוצה של המשפחה."); }
      catch { toast(SITE); }
    };
    $("#story").onclick = () => storyImage(k, pctT);
    window.scrollTo({ top: 0, behavior: "smooth" });
  }

  function toast(msg) { const el = $("#toast"); if (el) el.textContent = msg; }

  // ---------- story image (1080×1920) ----------
  async function storyImage(k, pctT) {
    const T = TYPES[k];
    toast("מכינה תמונה...");
    try { await document.fonts.load('700 100px "Karantina"'); await document.fonts.load('800 40px "Assistant"'); } catch {}
    const c = document.createElement("canvas");
    c.width = 1080; c.height = 1920;
    const x = c.getContext("2d");
    x.fillStyle = "#F1F4E8"; x.fillRect(0, 0, 1080, 1920);
    x.fillStyle = T.hex; x.fillRect(0, 0, 1080, 28);
    x.direction = "rtl"; x.textAlign = "center"; x.fillStyle = "#1F2A1E";

    x.font = '800 54px "Assistant", Arial';
    x.fillText("יצאתי", 540, 300);

    const img = new Image();
    img.src = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(SVG[k]);
    await img.decode().catch(() => {});
    x.drawImage(img, 290, 360, 500, 500);

    x.fillStyle = T.hex;
    x.font = '700 300px "Karantina", Arial';
    x.fillText(T.name, 540, 1150);
    x.fillStyle = "#1F2A1E";
    x.font = '800 58px "Assistant", Arial';
    x.fillText(T.tag, 540, 1260);
    x.font = '600 44px "Assistant", Arial';
    x.fillStyle = "#5B6A56";
    x.fillText(`${pctT}% עגבנייה · ${100 - pctT}% מלפפון`, 540, 1350);

    // axis
    const grad = x.createLinearGradient(140, 0, 940, 0);
    grad.addColorStop(0, "#D2362B"); grad.addColorStop(.35, "#E8930C"); grad.addColorStop(.65, "#7FA646"); grad.addColorStop(1, "#2F6B35");
    x.fillStyle = grad; x.beginPath(); x.roundRect(140, 1460, 800, 22, 11); x.fill();
    const mx = 940 - (pctT / 100) * 800;
    x.fillStyle = "#fff"; x.strokeStyle = "#1F2A1E"; x.lineWidth = 8;
    x.beginPath(); x.arc(mx, 1471, 26, 0, Math.PI * 2); x.fill(); x.stroke();
    x.fillStyle = "#1F2A1E"; x.font = '700 64px "Karantina", Arial';
    x.textAlign = "right"; x.fillText("מלפפון", 940, 1570);
    x.textAlign = "left"; x.fillText("עגבנייה", 140, 1570);

    x.textAlign = "center";
    x.font = '800 52px "Assistant", Arial';
    x.fillText("ואתם? 12 שאלות:", 540, 1720);
    x.font = '600 44px "Assistant", Arial';
    x.fillStyle = "#5B6A56";
    x.fillText("impactos.co.il/yerakot", 540, 1790);

    const blob = await new Promise(r => c.toBlob(r, "image/png"));
    const file = new File([blob], `yerakot-${k}.png`, { type: "image/png" });
    try {
      if (navigator.canShare && navigator.canShare({ files: [file] })) {
        await navigator.share({ files: [file], text: "ואתם? " + SITE });
        toast("");
        return;
      }
    } catch (e) { if (e && e.name === "AbortError") { toast(""); return; } }
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob); a.download = file.name;
    document.body.appendChild(a); a.click(); a.remove();
    toast("התמונה נשמרה. אפשר להעלות אותה לסטורי.");
  }

  intro();
})();
</script>

</body>
</html>
